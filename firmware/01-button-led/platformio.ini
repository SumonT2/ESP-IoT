; Phase 1 — button + LED + local state machine (no network yet).
; Uses each board's onboard BOOT/FLASH button and onboard LED.
; Build/upload one board:  pio run -e esp32c3 -t upload -t monitor

[platformio]
default_envs = esp32c6, esp32c3, esp8266

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = time
build_flags =
    -DFW_VERSION=\"0.1.0\"

; Shared settings for ESP32 family (Arduino-ESP32 core 3.x via pioarduino)
[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
monitor_filters = esp32_exception_decoder, time

[env:esp32c6]
extends = esp32_base
board = esp32-c6-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"esp32c6\"
    -DLED_PIN=8            ; addressable RGB LED
    -DLED_IS_RGB=1
    -DBUTTON_PIN=9         ; BOOT button, active LOW

[env:esp32c3]
extends = esp32_base
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"esp32c3\"
    -DLED_PIN=8            ; blue LED, active LOW
    -DLED_ACTIVE_LOW=1
    -DBUTTON_PIN=9         ; BOOT button, active LOW
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp8266]
platform = espressif8266
board = nodemcuv2
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"esp8266\"
    -DLED_PIN=2            ; blue LED on ESP-12E, active LOW
    -DLED_ACTIVE_LOW=1
    -DBUTTON_PIN=0         ; FLASH button, active LOW
