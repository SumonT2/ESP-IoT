; Phase 0 — board check: prints chip info and blinks the onboard LED.
; Build/upload one board:  pio run -e esp32c3 -t upload -t monitor

[platformio]
default_envs = esp32c6, esp32c3, esp8266

[env]
framework = arduino
monitor_speed = 115200

; ESP32-C6 needs Arduino-ESP32 core 3.x -> use the pioarduino platform
; (the official PlatformIO espressif32 platform ships core 2.x, no C6 support).
[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
build_flags =
    -DLED_PIN=8          ; DevKitC-1 addressable RGB LED on GPIO8
    -DLED_IS_RGB=1
    ; If Serial shows nothing and your board has only ONE USB-C port
    ; (native USB), uncomment the next two lines:
    ; -DARDUINO_USB_MODE=1
    ; -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
build_flags =
    -DLED_PIN=8          ; Super Mini blue LED on GPIO8, active LOW
    -DLED_ACTIVE_LOW=1
    -DARDUINO_USB_MODE=1         ; Super Mini uses native USB (no UART chip)
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp8266]
platform = espressif8266
board = nodemcuv2
build_flags =
    -DLED_PIN=2          ; ESP-12E blue LED on GPIO2, active LOW
    -DLED_ACTIVE_LOW=1
