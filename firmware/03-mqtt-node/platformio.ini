; Phase 3 — Wi-Fi + MQTT node. Button/LED state syncs to the broker.
; Copy src/secrets.h.example -> src/secrets.h and fill it in (git-ignored).
; Build/upload:  pio run -e esp32c3 -t upload -t monitor

[platformio]
default_envs = esp32c6, esp32c3, esp8266

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = time
build_flags =
    -DFW_VERSION=\"0.2.1\"
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0

[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
monitor_filters = esp32_exception_decoder, time

[env:esp32c6]
extends = esp32_base
board = esp32-c6-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"esp32c6\"
    -DBOARD_C6=1
    -DLED_PIN=8
    -DLED_IS_RGB=1
    -DBUTTON_PIN=9

[env:esp32c3]
extends = esp32_base
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"esp32c3\"
    -DBOARD_C3=1
    -DLED_PIN=8
    -DLED_ACTIVE_LOW=1
    -DBUTTON_PIN=9
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp8266]
platform = espressif8266
board = nodemcuv2
board_build.f_cpu = 160000000L
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"esp8266\"
    -DBOARD_8266=1
    -DLED_PIN=2
    -DLED_ACTIVE_LOW=1
    -DBUTTON_PIN=0
