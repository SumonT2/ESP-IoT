# Phase 2 — LAN MQTT listener.
# Plain MQTT (no TLS) until Phase 8. Reachable from the LAN only: the Windows
# Hyper-V firewall rule restricts port 1883 to the local subnet.
# Install: sudo cp lan.conf /etc/mosquitto/conf.d/lan.conf

listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd
